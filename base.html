<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Каталог книг{% endblock %}</title>
    <!-- Bootstrap 5 CSS (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .status-not_started { color: #6c757d; } /* Серый — не начата */
        .status-reading { color: #ffc107; }     /* Жёлтый — читаю */
        .status-read { color: #28a745; }        /* Зелёный — прочитана */
    </style>
</head>
<body>
    <!-- Навигация -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <!-- ИСПРАВЛЕНО: ссылка на главную страницу 'home' -->
            <a class="navbar-brand" href="{% url 'home' %}">
                📚 Каталог книг
            </a>
            <div class="navbar-nav ms-auto">
                {% if user.is_authenticated %}
                    <span class="navbar-text text-white me-3">
                        Привет, <strong>{{ user.username }}</strong>!
                    </span>
                    <!-- Опционально: можно использовать logout из users, а не admin -->
                    <a class="btn btn-outline-light btn-sm" href="{% url 'logout' %}">
                        Выйти
                    </a>
                {% else %}
                    <a class="btn btn-light btn-sm" href="{% url 'login' %}">
                        Войти
                    </a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Основной контент -->
    <div class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}
    </div>

    <!-- Bootstrap 5 JS (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
